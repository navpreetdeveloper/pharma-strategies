; Initial profile for a dedicated 4 GiB host; measure RSS and queueing before tuning.
[pharma]
user = www-data
group = www-data
listen = /run/php/php8.4-pharma.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 185s
request_slowlog_timeout = 3s
slowlog = /var/log/php8.4-fpm-pharma-slow.log
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 256M
php_admin_flag[display_errors] = off
