# Replace pharma.example.com and certificate paths before installation.
server {
 listen 80;
 server_name pharma.example.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://pharma.example.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name pharma.example.com;
 ssl_certificate /etc/letsencrypt/live/pharma.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/pharma.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /srv/pharma/current/public;
 index index.php;
 client_max_body_size 128m;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location /app/ {
  proxy_pass http://127.0.0.1:8081;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 90s;
 }
 location /apps/ { return 404; }
 location = /index.php {
  # Compress public static assets, not reflected CSRF-bearing private responses.
  gzip off;
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
  fastcgi_param DOCUMENT_ROOT $realpath_root;
  fastcgi_param HTTPS on;
  fastcgi_pass unix:/run/php/php8.4-pharma.sock;
  fastcgi_read_timeout 180s;
 }
 location ~ \.php$ { return 404; }
 location ~ /\.(?!well-known).* { deny all; }
 location ~* ^/(?:hot|storage/|vendor/|firebase/|firebase-app/) { return 404; }
 location ^~ /build/ { try_files $uri =404; expires 1y; }
 location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
}
